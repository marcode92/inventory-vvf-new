<div class="info-container">
    <mat-card class="info-box">
        <form [formGroup]="assignForm">

            <div class="info-box">
                <div class="col-position">
                    <h4>Stanza</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <input matInput type="text" formControlName="stanza" />
                        <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
                    </mat-form-field>
                </div>
                <div class="col-position">
                    <h4>Possessore</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <input matInput type="text" formControlName="possessore" />
                        <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
                    </mat-form-field>
                </div>
                <div class="col-position">
                    <h4>Postazione</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <input matInput type="text" formControlName="postazione" />
                        <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
                    </mat-form-field>
                </div>
            </div>

        </form>
        <div align="center">
            <button mat-icon-button type="button" class="big-button"><mat-icon
                    class="big-icon">keyboard_arrow_right</mat-icon></button>
        </div>
    </mat-card>
    <mat-card class="table-box">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="posizione">
                <th mat-header-cell *matHeaderCellDef>
                    Posizione
                </th>
                <td mat-cell *matCellDef="let assegnazione"> <!-- {{ assegnazione.posizione }} --> mario rossi stanza
                    503</td>
            </ng-container>
            <ng-container matColumnDef="articolo">
                <th mat-header-cell *matHeaderCellDef>
                    Articolo
                </th>
                <td mat-cell *matCellDef="let assegnazione; let i = index"> fujitus 360 led pam pum</td>
            </ng-container>
            <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef>

                </th>
                <td mat-cell *matCellDef="let assegnazione"> 
                    <button mat-icon-button >
                        <mat-icon> delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
        </table>
    </mat-card>
    <mat-card class="info-box">
        <div align="center">
            <button mat-icon-button type="button" class="big-button"><mat-icon
                    class="big-icon">keyboard_arrow_left</mat-icon></button>
        </div>
        <form [formGroup]="assignForm">

            <div class="info-box">
                <div class="col-position">
                    <h4>Categoria</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <mat-select formControlName="categoria">
                            <mat-option *ngFor="let cat of listCatName" [value]="cat">
                                {{ cat }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-position">
                    <h4>SottoCategoria</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <mat-select formControlName="sottocategoria">
                            <mat-option *ngFor="let cat of listsottoCatName" [value]="cat">
                                {{ cat }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-position">
                    <h4>Modello</h4>
                    <mat-form-field appearance="outline" class="margin">
                        <mat-select formControlName="modello">
                            <mat-option *ngFor="let model of models" [value]="model">
                                {{ model }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-position">
                    <h4>Disponibilità 30/30</h4>
                </div>
            </div>

        </form>
    </mat-card>

</div>
