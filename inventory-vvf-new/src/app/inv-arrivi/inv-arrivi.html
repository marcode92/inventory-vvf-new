<div class="row-position">
    <mat-icon fontSet="material-symbols-outlined" class="layers-icon">
        deployed_code
    </mat-icon>
    <h2>Gestione arrivi </h2>
</div>
   <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
            </th>
            <td mat-cell *matCellDef="let row; let i = index">
               
            </td>
        </ng-container>
        <ng-container matColumnDef="nome_modello">
            <th mat-header-cell *matHeaderCellDef>
                Modello
            </th>
            <td mat-cell *matCellDef="let row"> {{ row.nome_modello }}</td>
        </ng-container>
        <ng-container matColumnDef="nome_categoria">
            <th mat-header-cell *matHeaderCellDef>
                Categoria
            </th>
            <td mat-cell *matCellDef="let row"> {{ row.nome_categoria }}</td>
        </ng-container>

        <ng-container matColumnDef="nome_sottocategoria">
            <th mat-header-cell *matHeaderCellDef>
                Sottocategoria
            </th>
            <td mat-cell *matCellDef="let row"> {{row.nome_sottocategoria}}
            </td>
        </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
    </table>
<form [formGroup]="arrivalCtrl">  
    <div class="info-box">
        <div class="col-position">
            <label>Quantità</label>
            <mat-form-field appearance="outline" class="margin">
                <input matInput type="number" formControlName="quantita" />
                <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
            </mat-form-field>
            <mat-form-field>
                <mat-label>Seleziona data di arrivo</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="data">
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-position">
            <label>Mittente</label>
            <mat-form-field appearance="outline" class="margin">
                <input matInput type="text" formControlName="mittente" />
                <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
            </mat-form-field>
        </div>
    </div>

    <div align="end" class="position-footer">
        <button mat-button mat-dialog-close>Annulla</button>
        <button mat-raised-button color="primary">Salva</button>
    </div>
</form>
