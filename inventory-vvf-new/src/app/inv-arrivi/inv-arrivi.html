<div class="row-position">
    <mat-icon fontSet="material-symbols-outlined" class="layers-icon">
        deployed_code
    </mat-icon>
    <h2>Gestione arrivi </h2>
</div>
<form [formGroup]="arriveForm">
    <div class="info-box">
        <div class="col-position">
            <label>Categoria</label>
            <mat-form-field appearance="outline" class="margin">
                <mat-select formControlName="categoria">
                    <mat-option *ngFor="let cat of listCatName" [value]="cat">
                        {{ cat }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-position">
            <label>SottoCategoria</label>
            <mat-form-field appearance="outline" class="margin">
                <mat-select formControlName="sottocategoria">
                    <mat-option *ngFor="let cat of listsottoCatName" [value]="cat">
                        {{ cat }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-position">
            <label>Nome Modello</label>
            <mat-form-field appearance="outline" class="margin">
                <mat-select formControlName="modello">
                    <mat-option *ngFor="let model of models" [value]="model">
                        {{ model }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>
    <div class="info-box">
        <div class="col-position">
            <label>Quantità</label>
            <mat-form-field appearance="outline" class="margin">
                    <input matInput type="number" formControlName="quantità" />
                    <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
            </mat-form-field>
        </div>
        <div class="col-position">
            <label>Mittente</label>
            <mat-form-field appearance="outline" class="margin">
                    <input matInput type="text" formControlName="mittente" />
                    <!-- <mat-error *ngIf="field.get('value')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error> -->
            </mat-form-field>
            </div>
        </div>
           
            <div align="end" class="position-footer">
                <button mat-button mat-dialog-close>Annulla</button>
                <button mat-raised-button color="primary">Salva</button>
            </div>
</form>
